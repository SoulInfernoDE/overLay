# Dependency policy, enforced in CI: only GPL-3.0-compatible licenses, no known
# vulnerabilities, crates from crates.io only.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, not vulnerable: a compile-time proc macro pulled in by gtk-rs 0.18,
  # which Tauri 2 needs on Linux. Remove once Tauri moves to newer gtk bindings.
  { id = "RUSTSEC-2024-0370", reason = "build-time only, via gtk-rs 0.18 (Tauri 2 on Linux)" },
  # Unmaintained, not vulnerable: zvariant, zvariant_derive and zbus_names were merged
  # into zbus 6, but tauri-plugin-single-instance 2 still uses zbus 5 (D-Bus on Linux)
  # and no stable release has moved yet. Remove once it does.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via tauri-plugin-single-instance 2" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via tauri-plugin-single-instance 2" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via tauri-plugin-single-instance 2" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list is the policy, not an inventory: allow entries not yet used by any crate.
unused-allowed-license = "allow"
allow = [
  "GPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
