version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # fluent-bundle 0.16 still depends on fluent-langneg 0.13 (unic-langid types);
      # 0.14 switched to ICU types and no longer fits. Lift once fluent-bundle moves on.
      - dependency-name: fluent-langneg
        versions: ['>=0.14']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # svelte-check only supports TypeScript ^5 || ^6. With 7, npm keeps a hoisted 6
      # that svelte-check goes on using, so the bump would change nothing but the
      # manifest. Lift once svelte-check supports TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
